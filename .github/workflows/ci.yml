name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lafusee
          POSTGRES_PASSWORD: lafusee
          POSTGRES_DB: lafusee
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lafusee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lafusee:lafusee@localhost:5432/lafusee
      NEXTAUTH_SECRET: ci-secret-not-for-production-0000000000000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      PAYMENT_MOCK_ENABLED: "true"
      MANUAL_PAYMENT_WHATSAPP_NUMBER: "221770000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - name: E2E (parcours d'argent)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
